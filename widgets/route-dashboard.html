<style>
  :root{--a:#2dd4bf;--dim:#929bab;--line:rgba(255,255,255,.08);--panel:rgba(255,255,255,.045);--ok:#22c55e;--warn:#f59e0b;--bad:#fb7185}
  *{box-sizing:border-box}html,body{height:100%;background:transparent}body{margin:0;padding:1.4vh;display:grid;grid-template-rows:auto minmax(0,1.08fr) minmax(0,.92fr);gap:1vh;color:#eef2f6;font-family:Roboto,"PingFang SC","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;overflow:hidden;font-variant-numeric:tabular-nums}
  .head{display:flex;align-items:center;gap:1vh;min-height:0}.mark{width:3.6vh;height:3.6vh;border-radius:1vh;background:rgba(45,212,191,.18);color:var(--a);display:grid;place-items:center;font-size:2.3vh}.title{font-size:2.7vh;font-weight:700}.status{display:flex;align-items:center;gap:.6vh;font-size:1.5vh;color:var(--dim);margin-left:.5vh}.dot{width:1vh;height:1vh;border-radius:50%;background:var(--ok);box-shadow:0 0 1vh var(--ok)}.dot.off{background:var(--bad);box-shadow:0 0 1vh var(--bad)}.grow{flex:1}.count{color:var(--dim);font-size:1.4vh;text-align:center}.count b{display:block;font-size:2.1vh;color:#eef2f6}.count.err b{color:var(--bad)}
  .card{border:1px solid var(--line);border-radius:1.4vh;background:var(--panel);padding:1.3vh 1.5vh;min-height:0;overflow:hidden}.flow{display:grid;grid-template-columns:1.15fr .5fr 1fr .5fr 1.5fr;align-items:center;gap:1vh;height:100%}.node{height:100%;max-height:13vh;min-height:8vh;border:1px solid var(--line);border-radius:1.2vh;background:rgba(0,0,0,.12);display:flex;flex-direction:column;justify-content:center;padding:1.1vh 1.4vh;min-width:0}.node.selected{border-color:rgba(45,212,191,.56);box-shadow:0 0 2vh rgba(45,212,191,.07)}.node .cap{font-size:1.3vh;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-bottom:.45vh}.node strong{font-size:2.1vh;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.node small{font-size:1.35vh;color:var(--dim);margin-top:.4vh;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arrow{height:2px;background:linear-gradient(90deg,rgba(45,212,191,.25),var(--a));position:relative}.arrow:after{content:"";position:absolute;right:0;top:-.45vh;border-left:.8vh solid var(--a);border-top:.5vh solid transparent;border-bottom:.5vh solid transparent}.gateway{align-items:center;text-align:center}.gateway .symbol{font-size:3vh;color:var(--a)}.gateway strong{font-size:1.8vh}.gateway small{font-size:1.2vh}.route-result{display:flex;align-items:center;gap:1vh}.route-result .provider{font-size:1.35vh;color:var(--dim)}.route-result .account{font-size:2vh;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.route-result .model{font-size:1.4vh;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:.35vh}.badge{margin-left:auto;flex:0 0 auto;font-size:1.25vh;color:#7ee7dc;background:rgba(45,212,191,.13);padding:.35vh .8vh;border-radius:2vh}
  .bottom{display:grid;grid-template-columns:1.05fr 1.55fr;gap:1vh;min-height:0}.subcard{border:1px solid var(--line);border-radius:1.3vh;background:var(--panel);padding:1.15vh 1.4vh;min-height:0;overflow:hidden;display:flex;flex-direction:column}.subhead{font-size:1.45vh;color:var(--dim);display:flex;align-items:center;justify-content:space-between;margin-bottom:.8vh}.subhead b{color:#eef2f6;font-weight:600}.list{display:flex;flex-direction:column;gap:.45vh;overflow:hidden;min-height:0}.candidate{display:grid;grid-template-columns:2.3vh 1fr auto;align-items:center;gap:.8vh;padding:.55vh .7vh;border-radius:.7vh;background:rgba(255,255,255,.025);font-size:1.35vh;min-width:0}.rank{width:2.1vh;height:2.1vh;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.09);color:var(--dim);font-size:1.2vh}.candidate.hit .rank{background:rgba(45,212,191,.18);color:var(--a)}.candidate.skip{opacity:.46}.who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who small{display:block;color:var(--dim);font-size:1.1vh;margin-top:.15vh;overflow:hidden;text-overflow:ellipsis}.state{font-size:1.15vh;color:var(--dim);white-space:nowrap}.state.ok{color:var(--a)}.state.bad{color:var(--bad)}.recent{display:grid;grid-template-columns:1fr 1fr;gap:.45vh 1vh;overflow:hidden;min-height:0}.item{display:grid;grid-template-columns:4.5vh auto minmax(0,1fr) auto;align-items:center;gap:.6vh;font-size:1.2vh;padding:.45vh .55vh;border-bottom:1px solid rgba(255,255,255,.045);min-width:0}.time{color:var(--dim)}.agent{border-radius:1vh;background:rgba(167,139,250,.14);color:#c4b5fd;padding:.12vh .5vh;white-space:nowrap}.model{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d5dce5}.result{color:var(--dim);white-space:nowrap}.result.ok{color:var(--a)}.result.bad{color:var(--bad)}.empty{font-size:1.4vh;color:var(--dim);margin:auto}.offline{position:absolute;inset:0;display:none;place-items:center;background:rgba(8,10,14,.88);font-size:2.3vh;color:var(--dim);text-align:center;padding:4vh}body.down .offline{display:grid}
</style>
<style>
  body{padding:16vh 1.4vh 5vh;grid-template-rows:auto minmax(12vh,.48fr) minmax(0,1.52fr)}
  .bottom{grid-template-columns:.85fr 1.5fr}
  .recent{display:flex;flex-direction:column;gap:.15vh}
  .item{grid-template-columns:7vh 10vh minmax(0,1fr) auto;font-size:1.3vh;padding:.5vh .55vh;gap:1.4vh}
  .time{white-space:nowrap;padding-right:.8vh;border-right:1px solid var(--line)}.agent{text-align:center}
  .arrow.active{background:repeating-linear-gradient(90deg,rgba(45,212,191,.25) 0 1vh,var(--a) 1vh 1.8vh)}
  .bird-flight{position:absolute;z-index:2;top:50%;left:0;width:3.5vh;height:2.5vh;color:var(--a);filter:drop-shadow(0 0 .6vh rgba(45,212,191,.75));transform:translate(-50%,-50%)}
  .bird-flight svg{width:100%;height:100%;fill:currentColor;animation:wing .32s ease-in-out infinite alternate}
  @keyframes wing{from{transform:rotate(-12deg)}to{transform:rotate(10deg)}}
  @keyframes fly{from{left:4%;transform:translate(-50%,-50%) rotate(-5deg)}to{left:92%;transform:translate(-50%,-50%) rotate(4deg)}}
  .arrow.active .bird-flight{animation:fly 1.35s linear infinite}
</style>
<div class="head"><span class="mark">⇄</span><span class="title">magpie 路由</span><span class="status"><i class="dot" id="dot"></i><span id="live">实时 · 网关在线</span></span><span class="grow"></span><span class="count">总请求<b id="total">–</b></span><span class="count">改道<b id="rerouted">–</b></span><span class="count err">错误<b id="errors">–</b></span></div>
<div class="card"><div class="flow" id="flow"></div></div>
<div class="bottom"><div class="subcard"><div class="subhead"><b>本次路由候选</b><span id="candidate-note">优先顺序</span></div><div class="list" id="candidates"></div></div><div class="subcard"><div class="subhead"><b>最近路由</b><span id="updated">等待数据</span></div><div class="recent" id="recent"></div></div></div>
<div class="offline" id="offline"></div>
<script>
  const $=id=>document.getElementById(id), fmt=(n)=>n==null?'–':(n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(Math.round(n))), ms=n=>n?((n>=1000?(n/1000).toFixed(1)+'s':Math.round(n)+'ms')):'–';
  const agents={codex:'Codex',dsh:'DeepSeek Harness',claude:'Claude Code','claude-desktop':'Claude Desktop',magpie:'magpie',opencode:'OpenCode'}; let last=null;
  function render(d){last=d;const down=!d||!d.ok||!d.routing;document.body.classList.toggle('down',down);$('dot').className='dot'+(down?' off':'');$('live').textContent=down?(d?.err||'magpie 未连接'):'实时 · 网关在线';if(down){$('offline').textContent='magpie 路由数据暂不可用 · '+(d?.err||'等待下一次同步');return}
    const rt=d.routing, rows=rt.routes||[], active=rows.filter(x=>x.active), latest=active[active.length-1]||rows[rows.length-1];$('total').textContent=fmt(rt.requests);$('rerouted').textContent=fmt(rt.rerouted);$('errors').textContent=fmt(rt.errors);$('live').textContent=latest?.active?'数据交换中':'实时 · 网关在线';
    const flow=$('flow');flow.textContent='';if(!latest){flow.innerHTML='<div class="empty">暂无路由记录</div>';return}
    const addNode=(cap,title,sub,cls='')=>{const n=document.createElement('div');n.className='node '+cls;const c=document.createElement('span');c.className='cap';c.textContent=cap;const b=document.createElement('strong');b.textContent=title||'–';const s=document.createElement('small');s.textContent=sub||'';n.append(c,b,s);flow.append(n);};
    addNode('Agent · '+(agents[latest.agent]||latest.agent),latest.model,latest.effort?'推理强度 · '+latest.effort:'请求来源');
    const a=document.createElement('div');a.className='arrow'+(latest.active?' active':'');if(latest.active){const bird=document.createElement('span');bird.className='bird-flight';bird.innerHTML='<svg viewBox="0 0 40 24" aria-hidden="true"><path d="M1 13c7-1 11-6 16-11 1 5 4 8 9 9-5 0-8 2-11 5-4-2-8-3-14-3zm17 4c8-1 13-4 20-10-2 8-8 13-17 15z"/></svg>';a.append(bird)}flow.append(a);
    const gate=document.createElement('div');gate.className='node gateway';gate.innerHTML='<span class="symbol">⇄</span><strong>magpie</strong><small>127.0.0.1:3425</small>';flow.append(gate);
    const b=document.createElement('div');b.className='arrow';flow.append(b);
    const chosen=(latest.order||[]).find(x=>x.eligible&&x.provider.toLowerCase().replace(/\s/g,'')===String(latest.provider).toLowerCase())||(latest.order||[]).find(x=>x.eligible);
    const target=document.createElement('div');target.className='node selected';const cap=document.createElement('span');cap.className='cap';cap.textContent='最终路由 · '+(latest.active?'数据交换中':latest.done?'已完成':'处理中');const rr=document.createElement('div');rr.className='route-result';const text=document.createElement('div');text.style.minWidth='0';const p=document.createElement('div');p.className='provider';p.textContent=chosen?.provider||latest.provider||'Provider';const acct=document.createElement('div');acct.className='account';acct.textContent=chosen?.account||'账户信息不可用';const model=document.createElement('div');model.className='model';model.textContent=latest.model||'';text.append(p,acct,model);rr.append(text);const badge=document.createElement('span');badge.className='badge';badge.textContent=latest.active?'交换中':latest.status>=200&&latest.status<400?'HTTP '+latest.status:(latest.done?'失败':'进行中');rr.append(badge);target.append(cap,rr);flow.append(target);
    const cs=$('candidates');cs.textContent='';const ordered=latest.order||[];$('candidate-note').textContent=latest.affinity?.kept?'会话粘性 · '+(latest.affinity.why||'保持账户'):'按配置优先级';if(!ordered.length)cs.innerHTML='<div class="empty">暂无候选账户</div>';ordered.slice(0,6).forEach((x,i)=>{const el=document.createElement('div');el.className='candidate'+(x.eligible&&x===chosen?' hit':'')+(!x.eligible?' skip':'');const rk=document.createElement('span');rk.className='rank';rk.textContent=x.eligible?(x.rank||i+1):'–';const who=document.createElement('span');who.className='who';who.textContent=(x.provider||'')+' · '+(x.account||'未知账户');const sm=document.createElement('small');sm.textContent=x.model||'';who.append(sm);const st=document.createElement('span');st.className='state '+(!x.eligible?'bad':x===chosen?'ok':'');st.textContent=!x.eligible?(x.barred?'额度/状态不可用':x.unlisted?'未列入候选':'跳过'):x===chosen?'命中':'候选';el.append(rk,who,st);cs.append(el)});
    const recent=$('recent');recent.textContent='';rows.slice(-6).reverse().forEach(x=>{const el=document.createElement('div');el.className='item';const t=document.createElement('span');t.className='time';t.textContent=x.at||'';const ag=document.createElement('span');ag.className='agent';ag.textContent=agents[x.agent]||x.agent||'?';const model=document.createElement('span');model.className='model';model.textContent=x.model||'';const res=document.createElement('span');res.className='result '+(x.active?'':x.status>=200&&x.status<400?'ok':'bad');res.textContent=(x.active?'进行中':x.status||'…')+' · '+ms(x.ms);el.append(t,ag,model,res);recent.append(el)});$('updated').textContent=(latest.active?'交换中 · ':'更新于 ')+(latest.at||'刚刚')+' · '+ms(latest.ms)+' · 首字 '+ms(latest.ttft);
  }
  phonebox.on('push',v=>render(v?.magpie?.data));
</script>
